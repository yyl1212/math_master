<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Fractional rectangle area"><title>Fractional rectangle area</title><desc>A unit square is split into four columns and two rows. The overlap occupies three of eight equal cells: three quarters times one half.</desc><rect x="0" y="0" width="640" height="280" fill="#FFFFFF"/><rect x="60" y="10" width="60" height="120" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="120" y="10" width="60" height="120" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="180" y="10" width="60" height="120" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="240" y="10" width="60" height="120" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><rect x="60" y="130" width="60" height="120" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><rect x="120" y="130" width="60" height="120" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><rect x="180" y="130" width="60" height="120" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><rect x="240" y="130" width="60" height="120" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><text x="330" y="190" font-size="18" fill="#17324D">(3/4) * (1/2) = 3/8</text><text x="330" y="220" font-size="18" fill="#17324D">square units</text><text x="330" y="115" font-size="18" fill="#17324D">height 1/2</text><text x="330" y="75" font-size="18" fill="#17324D">width 3/4</text></svg>
