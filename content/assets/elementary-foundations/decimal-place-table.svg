<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Decimal place-value table"><title>Decimal place-value table</title><desc>Digits of two point five zero align with units, tenths and hundredths. The trailing zero does not change value.</desc><rect x="0" y="0" width="640" height="280" fill="#FFFFFF"/><rect x="70" y="65" width="160" height="100" fill="#E7EEF5" stroke="#38546B" stroke-width="1"/><text x="85" y="95" font-size="16" fill="#17324D">units</text><text x="130" y="140" font-size="24" fill="#17324D">2</text><rect x="230" y="65" width="160" height="100" fill="#E7EEF5" stroke="#38546B" stroke-width="1"/><text x="245" y="95" font-size="16" fill="#17324D">tenths</text><text x="290" y="140" font-size="24" fill="#17324D">5</text><rect x="390" y="65" width="160" height="100" fill="#E7EEF5" stroke="#38546B" stroke-width="1"/><text x="405" y="95" font-size="16" fill="#17324D">hundredths</text><text x="450" y="140" font-size="24" fill="#17324D">0</text><text x="70" y="220" font-size="18" fill="#17324D">2.50 = 2 + 5/10 + 0/100 = 2.5</text></svg>
