      },
      "PreauthCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-mm_preauth",
        "description": "10 minute anonymous context, consumed by successful registration/login; development mm_preauth_dev."
      },
      "CSRFToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token",
        "description": "Synchronizer proof from the current browser auth/context response; cannot identify a user by itself."
      }
