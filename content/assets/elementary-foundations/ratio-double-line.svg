<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Double number line at a constant unit rate"><title>Double number line at a constant unit rate</title><desc>Aligned equal notebook intervals map zero through five notebooks to zero through twenty currency units at four currency units per notebook.</desc><rect x="0" y="0" width="640" height="280" fill="#FFFFFF"/><line x1="80" y1="90" x2="550" y2="90" stroke="#38546B" stroke-width="2"/><line x1="80" y1="160" x2="550" y2="160" stroke="#38546B" stroke-width="2"/><line x1="80" y1="82" x2="80" y2="98" stroke="#38546B" stroke-width="2"/><line x1="80" y1="152" x2="80" y2="168" stroke="#38546B" stroke-width="2"/><text x="75" y="70" font-size="16" fill="#17324D">0</text><text x="70" y="194" font-size="16" fill="#17324D">0</text><line x1="174" y1="82" x2="174" y2="98" stroke="#38546B" stroke-width="2"/><line x1="174" y1="152" x2="174" y2="168" stroke="#38546B" stroke-width="2"/><text x="169" y="70" font-size="16" fill="#17324D">1</text><text x="164" y="194" font-size="16" fill="#17324D">4</text><line x1="268" y1="82" x2="268" y2="98" stroke="#38546B" stroke-width="2"/><line x1="268" y1="152" x2="268" y2="168" stroke="#38546B" stroke-width="2"/><text x="263" y="70" font-size="16" fill="#17324D">2</text><text x="258" y="194" font-size="16" fill="#17324D">8</text><line x1="362" y1="82" x2="362" y2="98" stroke="#38546B" stroke-width="2"/><line x1="362" y1="152" x2="362" y2="168" stroke="#38546B" stroke-width="2"/><text x="357" y="70" font-size="16" fill="#17324D">3</text><text x="352" y="194" font-size="16" fill="#17324D">12</text><line x1="456" y1="82" x2="456" y2="98" stroke="#38546B" stroke-width="2"/><line x1="456" y1="152" x2="456" y2="168" stroke="#38546B" stroke-width="2"/><text x="451" y="70" font-size="16" fill="#17324D">4</text><text x="446" y="194" font-size="16" fill="#17324D">16</text><line x1="550" y1="82" x2="550" y2="98" stroke="#38546B" stroke-width="2"/><line x1="550" y1="152" x2="550" y2="168" stroke="#38546B" stroke-width="2"/><text x="545" y="70" font-size="16" fill="#17324D">5</text><text x="540" y="194" font-size="16" fill="#17324D">20</text><text x="80" y="35" font-size="16" fill="#17324D">Notebooks</text><text x="80" y="235" font-size="16" fill="#17324D">Cost: constant 4 currency units per notebook</text></svg>
