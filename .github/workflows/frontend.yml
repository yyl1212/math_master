name: P2 英文网站验证
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: go1.27.1
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgres://math_master:ci-only@127.0.0.1:5432/math_master_test_ci?sslmode=disable
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: math_master
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: math_master_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U math_master -d math_master_test_ci"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - name: 安装锁定依赖
        run: node tools/verify/run.mjs --cwd frontend -- npm ci
      - name: 检查公开契约类型
        run: |
          node tools/verify/run.mjs --cwd frontend -- npm run api:generate
          git diff --exit-code -- frontend/src/lib/api/generated.d.ts
      - name: 类型与单元验证
        run: |
          node tools/verify/run.mjs --cwd frontend -- npm run typecheck
          node tools/verify/run.mjs --cwd frontend -- npm test
      - name: 生产构建与依赖审计
        run: |
          node tools/verify/run.mjs --cwd frontend -- npm run build
          node tools/verify/run.mjs --cwd frontend -- npm audit --omit=dev
      - name: 隔离联调环境验证与构建
        run: |
          node tools/verify/run.mjs --cwd backend -- go test ./internal/e2etest ./internal/testutil -timeout 5m -count=1
          node tools/verify/run.mjs --cwd backend -- go build -o bin/e2e-harness ./cmd/e2e-harness
      - name: 安装锁定浏览器
        run: node tools/verify/run.mjs --cwd frontend -- npm exec -- playwright install --with-deps chromium
      - name: 真实 Go 与 PostgreSQL 浏览器回归
        run: node tools/verify/run.mjs --cwd frontend -- npm run e2e
      - name: 保留失败诊断
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
