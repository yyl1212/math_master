<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Uniform whole-number line"><title>Uniform whole-number line</title><desc>Zero through six use equal intervals. The marked point five is five unit intervals from zero.</desc><rect x="0" y="0" width="640" height="280" fill="#FFFFFF"/><line x1="45" y1="100" x2="585" y2="100" stroke="#38546B" stroke-width="2"/><line x1="45" y1="90" x2="45" y2="110" stroke="#38546B" stroke-width="2"/><text x="40" y="135" font-size="18" fill="#17324D">0</text><line x1="135" y1="90" x2="135" y2="110" stroke="#38546B" stroke-width="2"/><text x="130" y="135" font-size="18" fill="#17324D">1</text><line x1="225" y1="90" x2="225" y2="110" stroke="#38546B" stroke-width="2"/><text x="220" y="135" font-size="18" fill="#17324D">2</text><line x1="315" y1="90" x2="315" y2="110" stroke="#38546B" stroke-width="2"/><text x="310" y="135" font-size="18" fill="#17324D">3</text><line x1="405" y1="90" x2="405" y2="110" stroke="#38546B" stroke-width="2"/><text x="400" y="135" font-size="18" fill="#17324D">4</text><line x1="495" y1="90" x2="495" y2="110" stroke="#38546B" stroke-width="2"/><text x="490" y="135" font-size="18" fill="#17324D">5</text><line x1="585" y1="90" x2="585" y2="110" stroke="#38546B" stroke-width="2"/><text x="580" y="135" font-size="18" fill="#17324D">6</text><circle cx="495" cy="100" r="6" fill="#C56139"/><text x="45" y="185" font-size="18" fill="#17324D">Each interval is 1 unit; distance from 0 to 5 is 5.</text></svg>
