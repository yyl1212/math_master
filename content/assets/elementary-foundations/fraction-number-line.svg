<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Five quarters on a consistent number line"><title>Five quarters on a consistent number line</title><desc>Eight equal quarter intervals span zero to two. The fifth interval endpoint marks five quarters.</desc><rect x="0" y="0" width="640" height="280" fill="#FFFFFF"/><line x1="60" y1="100" x2="560" y2="100" stroke="#38546B" stroke-width="2"/><line x1="60.0" y1="90" x2="60.0" y2="110" stroke="#38546B" stroke-width="2"/><text x="50.0" y="140" font-size="14" fill="#17324D">0</text><line x1="122.5" y1="90" x2="122.5" y2="110" stroke="#38546B" stroke-width="2"/><text x="112.5" y="140" font-size="14" fill="#17324D">1/4</text><line x1="185.0" y1="90" x2="185.0" y2="110" stroke="#38546B" stroke-width="2"/><text x="175.0" y="140" font-size="14" fill="#17324D">2/4</text><line x1="247.5" y1="90" x2="247.5" y2="110" stroke="#38546B" stroke-width="2"/><text x="237.5" y="140" font-size="14" fill="#17324D">3/4</text><line x1="310.0" y1="90" x2="310.0" y2="110" stroke="#38546B" stroke-width="2"/><text x="300.0" y="140" font-size="14" fill="#17324D">1</text><line x1="372.5" y1="90" x2="372.5" y2="110" stroke="#38546B" stroke-width="2"/><text x="362.5" y="140" font-size="14" fill="#17324D">5/4</text><line x1="435.0" y1="90" x2="435.0" y2="110" stroke="#38546B" stroke-width="2"/><text x="425.0" y="140" font-size="14" fill="#17324D">6/4</text><line x1="497.5" y1="90" x2="497.5" y2="110" stroke="#38546B" stroke-width="2"/><text x="487.5" y="140" font-size="14" fill="#17324D">7/4</text><line x1="560.0" y1="90" x2="560.0" y2="110" stroke="#38546B" stroke-width="2"/><text x="550.0" y="140" font-size="14" fill="#17324D">2</text><circle cx="372.5" cy="100" r="6" fill="#C56139"/><text x="60" y="190" font-size="18" fill="#17324D">5/4 = 1 + 1/4; the unit scale stays fixed.</text></svg>
