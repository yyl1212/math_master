name: Go 内容账户与题库验证
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPIC_COMPATIBILITY_STAGE: cutover
      CGO_ENABLED: '0'
      GOTOOLCHAIN: go1.27.1
      TEST_DATABASE_URL: postgres://math_master:ci-only@127.0.0.1:5432/math_master_test_ci?sslmode=disable
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: math_master
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: math_master_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U math_master -d math_master_test_ci"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - name: 格式检查
        run: |
          node tools/verify/run.mjs --cwd backend -- node -e '
          const {spawnSync}=require("node:child_process");
          const r=spawnSync("gofmt",["-l","."],{encoding:"utf8"});
          process.stdout.write(r.stdout??"");process.stderr.write(r.stderr??"");
          process.exit(r.status!==0?1:r.stdout.trim()?1:0);'
          git diff --check
      - name: 验证入口与资料快照
        run: node tools/verify/run.mjs -- node --test tools/verify/run.test.mjs tools/verify/learning-compatibility.test.mjs tools/verify/feedback-compatibility.test.mjs tools/verify/correction-compatibility.test.mjs tools/verify/feedback-ci.test.mjs tools/verify/correction-ci.test.mjs tools/content-ingest/snapshot.test.mjs tools/content-ingest/source-index.test.mjs tools/content-ingest/source-report.test.mjs tools/verify/content-acceptance.test.mjs tools/verify/content-acceptance-ci.test.mjs tools/verify/content-review.test.mjs tools/verify/content-review-ci.test.mjs
      - name: Go 静态检查
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go vet ./...
      - name: 内容与 HTTP 校验
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./cmd/server ./internal/correction ./internal/notification ./internal/feedback ./internal/assessment ./internal/learning ./internal/question ./internal/auth ./internal/content ./internal/publication ./internal/config ./internal/httpapi ./internal/e2etest ./internal/testutil ./internal/buildmeta ./internal/health -timeout 5m -count=1
      - name: 常规 PostgreSQL 集成分批 1
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 node ../tools/verify/go-batches.mjs --batch 0 --size 70 --slots 4 --skip '^Test(Learning|Assessment|Feedback|Correction|Notification|ContentAudit|Taxonomy|Topic|Study)|^Test(WorkflowCapacityEnvelope|QuestionMaximumLegalWorkflow|QuestionCandidateCapacity)$'
      - name: 常规 PostgreSQL 集成分批 2
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 node ../tools/verify/go-batches.mjs --batch 1 --size 70 --slots 4 --skip '^Test(Learning|Assessment|Feedback|Correction|Notification|ContentAudit|Taxonomy|Topic|Study)|^Test(WorkflowCapacityEnvelope|QuestionMaximumLegalWorkflow|QuestionCandidateCapacity)$'
      - name: 常规 PostgreSQL 集成分批 3
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 node ../tools/verify/go-batches.mjs --batch 2 --size 70 --slots 4 --skip '^Test(Learning|Assessment|Feedback|Correction|Notification|ContentAudit|Taxonomy|Topic|Study)|^Test(WorkflowCapacityEnvelope|QuestionMaximumLegalWorkflow|QuestionCandidateCapacity)$'
      - name: 常规 PostgreSQL 集成分批 4
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 node ../tools/verify/go-batches.mjs --batch 3 --size 70 --slots 4 --skip '^Test(Learning|Assessment|Feedback|Correction|Notification|ContentAudit|Taxonomy|Topic|Study)|^Test(WorkflowCapacityEnvelope|QuestionMaximumLegalWorkflow|QuestionCandidateCapacity)$'
      - name: 常规 CLI 集成验证
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/cli -skip '^Test(Learning|Assessment|Feedback|Correction|Notification|ContentAudit|Taxonomy|Topic|Study)' -timeout 5m -count=1
      - name: 最大合法内容工作流
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestWorkflowCapacityEnvelope$' -timeout 5m -count=1 -v
      - name: 最大合法题库工作流
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestQuestionMaximumLegalWorkflow$' -timeout 5m -count=1 -v
      - name: 题库候选容量
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestQuestionCandidateCapacity$' -timeout 5m -count=1 -v
      - name: 学习测评真实数据库回归
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^Test(Learning|Assessment)' -skip '^TestLearningCapacity' -timeout 5m -count=1
      - name: 反馈真实数据库回归
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestFeedback' -skip '^TestFeedbackCapacity' -timeout 5m -count=1
      - name: 反馈历史容量与长期处理
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestFeedbackCapacity$' -timeout 5m -count=1 -v
      - name: 最大合法学习题源与证据
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestLearningCapacitySourceVolume$' -timeout 5m -count=1 -v
      - name: 最大合法固定路线容量
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestLearningCapacityMaxPool$' -timeout 5m -count=1 -v
      - name: 首批内容纯验收口径
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/contentaudit -timeout 5m -count=1
      - name: 首批内容只读数据库与CLI
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store ./internal/cli -run '^TestContentAudit' -skip '^TestContentAuditCapacity$' -timeout 5m -count=1
      - name: 首批只读最大合法内容与题库
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestContentAuditCapacity$' -timeout 5m -count=1 -v
      - name: 全量复核准备与证据纯层
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/contentreview -timeout 5m -count=1
      - name: 构建
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go build ./cmd/...

  correction_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPIC_COMPATIBILITY_STAGE: cutover
      CGO_ENABLED: '0'
      GOTOOLCHAIN: go1.27.1
      TEST_DATABASE_URL: postgres://math_master:ci-only@127.0.0.1:5432/math_master_test_ci?sslmode=disable
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: math_master
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: math_master_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U math_master -d math_master_test_ci"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - name: 纠错通知与有限CLI真实数据库回归
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store ./internal/cli -run '^Test(Correction|Notification)' -skip '^TestCorrectionCapacity' -timeout 5m -count=1
      - name: 千案件万证据完整影响处理
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestCorrectionCapacityImpact$' -timeout 5m -count=1 -v
      - name: 万通知与万次同源重跑
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestCorrectionCapacityNotifications$' -timeout 5m -count=1 -v

  topic_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPIC_COMPATIBILITY_STAGE: cutover
      CGO_ENABLED: '0'
      GOTOOLCHAIN: go1.27.1
      TEST_DATABASE_URL: postgres://math_master:ci-only@127.0.0.1:5432/math_master_test_ci?sslmode=disable
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: math_master
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: math_master_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U math_master -d math_master_test_ci"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - name: 主题分类捕获与兼容门禁
        run: node tools/verify/run.mjs -- node --test tools/topic-ingest/*.test.mjs tools/verify/topic-learning-compatibility.test.mjs tools/verify/topic-learning-ci.test.mjs tools/verify/go-batches.test.mjs
      - name: 主题分类真实数据库与CLI
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/taxonomy ./internal/store ./internal/cli -run '^Test(Taxonomy|Topic)' -skip '^Test(TaxonomyCapacity|TopicCutoverCapacity)' -timeout 5m -count=1
      - name: 完整分类与最大知识容量
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestTaxonomyCapacity6603With1000Knowledge$' -timeout 5m -count=1 -v
      - name: 个人主题学习真实数据库
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/study ./internal/store -run '^TestStudy' -skip '^TestStudyCapacity' -timeout 5m -count=1
      - name: 有限旧事实迁入CLI
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/cli -run '^TestStudyMigration' -timeout 5m -count=1
      - name: 十万旧学习事实有限迁入容量
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestTopicCutoverCapacity$' -timeout 5m -count=1 -v
      - name: 个人主题学习最大存储读取
        run: node tools/verify/run.mjs --cwd backend -- env CGO_ENABLED=0 GOTOOLCHAIN=go1.27.1 go test ./internal/store -run '^TestStudyCapacityReadPages$' -timeout 5m -count=1 -v
