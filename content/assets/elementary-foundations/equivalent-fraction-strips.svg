<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Equivalent halves and quarters"><title>Equivalent halves and quarters</title><desc>Two bars have the same total length. One of two parts and two of four parts shade the same length.</desc><rect x="0" y="0" width="640" height="280" fill="#FFFFFF"/><rect x="60" y="65" width="250" height="40" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="310" y="65" width="250" height="40" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><rect x="60" y="125" width="125" height="40" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="185" y="125" width="125" height="40" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="310" y="125" width="125" height="40" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><rect x="435" y="125" width="125" height="40" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><text x="60" y="210" font-size="18" fill="#17324D">Same whole: 1/2 = 2/4</text></svg>
