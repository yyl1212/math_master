name: math-master-preview
services:
  db:
    image: postgres:17.11@sha256:e31e3d5327d1806f6177827c9710643e4f35f7ab3f14d26d05332753d3e95ee0
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=${DB_LC_COLLATE:?required} --lc-ctype=${DB_LC_CTYPE:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
    networks: [app]
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: math-master-api:${RELEASE_SHA:?required}
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: {VCS_REF: '${RELEASE_SHA:?required}'}
    environment:
      APP_ENV: production
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?required}
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs: [/tmp:rw,size=64m]
    mem_limit: 512m
    restart: unless-stopped
    networks: [app]
    logging: *logging
  web:
    image: math-master-web:${RELEASE_SHA:?required}
    platform: linux/amd64
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: {VCS_REF: '${RELEASE_SHA:?required}'}
    environment:
      APP_ENV: production
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?required}
      GO_API_INTERNAL_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, --input-type=module, -e, 'const r=await fetch("http://127.0.0.1:3000/login",{signal:AbortSignal.timeout(5000)}); if(r.status!==200)process.exit(1)']
      interval: 10s
      timeout: 6s
      retries: 12
    read_only: true
    tmpfs: [/tmp:rw,size=64m, '/app/.next/cache:rw,size=64m,uid=1000,gid=1000,mode=0700']
    mem_limit: 768m
    restart: unless-stopped
    networks: [app]
    logging: *logging
  gateway:
    image: math-master-gateway:${RELEASE_SHA:?required}
    platform: linux/amd64
    build:
      context: .
      dockerfile: ops/caddy.Dockerfile
      args: {VCS_REF: '${RELEASE_SHA:?required}'}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?required}
      ACME_DIRECTORY: ${ACME_DIRECTORY:?required}
    ports: ['80:80', '443:443']
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 12
    sysctls: {net.ipv4.ip_unprivileged_port_start: '0'}
    mem_limit: 128m
    restart: unless-stopped
    networks: [app, edge]
    logging: *logging
networks:
  app: {internal: true}
  edge: {}
volumes:
  postgres-data: {name: math-master-preview-pgdata}
  caddy-data: {name: '${CADDY_DATA_VOLUME:?required}'}
  caddy-config: {name: math-master-preview-caddy-config}
