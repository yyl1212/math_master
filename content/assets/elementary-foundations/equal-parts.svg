<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Three quarters of one whole"><title>Three quarters of one whole</title><desc>Four equal-width pieces form one unit bar. Exactly three pieces are shaded.</desc><rect x="0" y="0" width="640" height="280" fill="#FFFFFF"/><rect x="60" y="75" width="125" height="55" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="185" y="75" width="125" height="55" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="310" y="75" width="125" height="55" fill="#91C8AE" stroke="#38546B" stroke-width="1"/><rect x="435" y="75" width="125" height="55" fill="#FFFFFF" stroke="#38546B" stroke-width="1"/><text x="60" y="165" font-size="18" fill="#17324D">3 of 4 equal parts = 3/4 of this whole</text><text x="60" y="210" font-size="18" fill="#17324D">All pieces have equal length.</text></svg>
